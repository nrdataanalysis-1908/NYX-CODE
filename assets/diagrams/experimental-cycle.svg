amily="Arial" font-size="14" font-weight="700">REPRODUÇÃO</text><path d="M290 176 L410 145 M580 141 L850 176 M935 202 V285 M850 311 L580 340 M410 341 L290 311 M205 285 V202" fill="none" stroke="#397FA3" stroke-width="2" stroke-dasharray="6 5"/><text x="48" y="365" fill="#829BAF" font-family="Arial" font-size="12">Principle: no optimization is valid without functional equivalence and repeatable measurement</text></svg>
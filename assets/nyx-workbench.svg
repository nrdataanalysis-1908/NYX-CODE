<text x="112" y="262" fill="#60E6FF" font-family="Consolas,monospace" font-size="18">01 / EDITOR — analysis.nyx</text>
<text x="122" y="330" fill="#547A91" font-family="Consolas,monospace" font-size="18">01</text><text x="164" y="330" fill="#C792EA" font-family="Consolas,monospace" font-size="19">fn</text><text x="195" y="330" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19">media(valores) {</text>
<text x="122" y="372" fill="#547A91" font-family="Consolas,monospace" font-size="18">02</text><text x="164" y="372" fill="#C4D8E6" font-family="Consolas,monospace" font-size="19">    let total = 0</text>
<text x="122" y="414" fill="#547A91" font-family="Consolas,monospace" font-size="18">03</text><text x="164" y="414" fill="#C792EA" font-family="Consolas,monospace" font-size="19">    while</text><text x="248" y="414" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19"> (i &lt; len(valores)) {</text>
<text x="122" y="456" fill="#547A91" font-family="Consolas,monospace" font-size="18">04</text><text x="164" y="456" fill="#C4D8E6" font-family="Consolas,monospace" font-size="19">        total = total + valores[i]</text>
<text x="122" y="498" fill="#547A91" font-family="Consolas,monospace" font-size="18">05</text><text x="164" y="498" fill="#C4D8E6" font-family="Consolas,monospace" font-size="19">        i = i + 1</text>
<text x="122" y="540" fill="#547A91" font-family="Consolas,monospace" font-size="18">06</text><text x="164" y="540" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19">    }</text>
<text x="122" y="582" fill="#547A91" font-family="Consolas,monospace" font-size="18">07</text><text x="164" y="582" fill="#C792EA" font-family="Consolas,monospace" font-size="19">    return</text><text x="254" y="582" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19"> total / len(valores)</text>
<text x="122" y="624" fill="#547A91" font-family="Consolas,monospace" font-size="18">08</text><text x="164" y="624" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19">}</text>
<text x="122" y="708" fill="#547A91" font-family="Consolas,monospace" font-size="18">09</text><text x="164" y="708" fill="#60E6FF" font-family="Consolas,monospace" font-size="19">let</text><text x="205" y="708" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19"> amostras = [21.5, 22.0, 23.4]</text>
<text x="122" y="750" fill="#547A91" font-family="Consolas,monospace" font-size="18">10</text><text x="164" y="750" fill="#60E6FF" font-family="Consolas,monospace" font-size="19">print</text><text x="218" y="750" fill="#E8F5FA" font-family="Consolas,monospace" font-size="19">(media(amostras))</text>
